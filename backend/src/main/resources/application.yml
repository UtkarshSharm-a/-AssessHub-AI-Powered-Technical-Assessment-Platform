spring:
  application:
    name: assessment-platform

  profiles:
    active: local

  devtools:
    restart:
      enabled: false

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/assessment_platform?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
          protocols: TLSv1.2
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  answer-key:
    secret: ${ANSWER_KEY_SECRET:}

  ai:
    gemini:
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.7-flash}

  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000

  otp:
    expiration-minutes: 5

server:
  port: ${PORT:8080}

logging:
  level:
    com.assessment.platform: DEBUGatform: DEBUG
